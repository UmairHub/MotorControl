<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="750" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Nucleo-F446RE + L298N + DC Motor - Wiring Diagram</text>

  <!-- Legend -->
  <g font-size="13" fill="#1a1a1a">
    <line x1="620" y1="55" x2="650" y2="55" stroke="#c0392b" stroke-width="3"/>
    <text x="656" y="59">Power (+)</text>
    <line x1="620" y1="75" x2="650" y2="75" stroke="#1a1a1a" stroke-width="3"/>
    <text x="656" y="79">Ground</text>
    <line x1="770" y1="55" x2="800" y2="55" stroke="#2471a3" stroke-width="3"/>
    <text x="806" y="59">PWM signal</text>
    <line x1="770" y1="75" x2="800" y2="75" stroke="#1e8449" stroke-width="3"/>
    <text x="806" y="79">GPIO signal</text>
    <line x1="620" y1="95" x2="650" y2="95" stroke="#b9770e" stroke-width="3"/>
    <text x="656" y="99">Motor output</text>
  </g>

  <!-- Nucleo-F446RE -->
  <rect x="300" y="110" width="360" height="140" rx="8" fill="#eaf2f8" stroke="#2c3e50" stroke-width="2"/>
  <text x="480" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Nucleo-F446RE</text>
  <text x="480" y="160" text-anchor="middle" font-size="12" fill="#555555">powered separately via USB</text>
  <text x="480" y="176" text-anchor="middle" font-size="12" fill="#555555">(do not power from motor battery)</text>

  <circle cx="360" cy="250" r="4" fill="#2471a3"/>
  <text x="368" y="268" font-size="13" fill="#1a1a1a">PA6</text>
  <circle cx="440" cy="250" r="4" fill="#1e8449"/>
  <text x="448" y="268" font-size="13" fill="#1a1a1a">PA8</text>
  <circle cx="520" cy="250" r="4" fill="#1e8449"/>
  <text x="528" y="268" font-size="13" fill="#1a1a1a">PA9</text>
  <circle cx="600" cy="250" r="4" fill="#1a1a1a"/>
  <text x="608" y="268" font-size="13" fill="#1a1a1a">GND</text>

  <!-- Nucleo -> L298N control wires -->
  <line x1="360" y1="250" x2="360" y2="390" stroke="#2471a3" stroke-width="3"/>
  <line x1="440" y1="250" x2="440" y2="390" stroke="#1e8449" stroke-width="3"/>
  <line x1="520" y1="250" x2="520" y2="390" stroke="#1e8449" stroke-width="3"/>
  <line x1="600" y1="250" x2="600" y2="390" stroke="#1a1a1a" stroke-width="3"/>

  <text x="368" y="330" font-size="12" fill="#2471a3">PWM</text>
  <text x="448" y="350" font-size="12" fill="#1e8449">dir bit 1</text>
  <text x="528" y="370" font-size="12" fill="#1e8449">dir bit 2</text>

  <!-- L298N -->
  <rect x="300" y="390" width="360" height="170" rx="8" fill="#fdf2e9" stroke="#2c3e50" stroke-width="2"/>
  <text x="480" y="415" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">L298N Driver Module</text>
  <text x="480" y="432" text-anchor="middle" font-size="12" fill="#555555">(remove ENA jumper cap)</text>

  <circle cx="360" cy="390" r="4" fill="#2471a3"/>
  <text x="368" y="404" font-size="12" fill="#1a1a1a">ENA</text>
  <circle cx="440" cy="390" r="4" fill="#1e8449"/>
  <text x="448" y="404" font-size="12" fill="#1a1a1a">IN1</text>
  <circle cx="520" cy="390" r="4" fill="#1e8449"/>
  <text x="528" y="404" font-size="12" fill="#1a1a1a">IN2</text>
  <circle cx="600" cy="390" r="4" fill="#1a1a1a"/>
  <text x="608" y="404" font-size="12" fill="#1a1a1a">GND</text>

  <!-- L298N left edge: power in -->
  <circle cx="300" cy="425" r="4" fill="#c0392b"/>
  <text x="250" y="412" font-size="13" fill="#1a1a1a">12V / VMS</text>
  <circle cx="300" cy="530" r="4" fill="#1a1a1a"/>
  <text x="260" y="517" font-size="13" fill="#1a1a1a">GND</text>

  <!-- L298N right edge: motor out -->
  <circle cx="660" cy="430" r="4" fill="#b9770e"/>
  <text x="668" y="422" font-size="13" fill="#1a1a1a">OUT1</text>
  <circle cx="660" cy="490" r="4" fill="#b9770e"/>
  <text x="668" y="482" font-size="13" fill="#1a1a1a">OUT2</text>

  <!-- Battery -->
  <rect x="60" y="390" width="140" height="90" rx="8" fill="#fdedec" stroke="#2c3e50" stroke-width="2"/>
  <text x="130" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">9V Battery</text>
  <text x="130" y="436" text-anchor="middle" font-size="12" fill="#555555">motor power only</text>
  <circle cx="200" cy="425" r="4" fill="#c0392b"/>
  <text x="178" y="415" font-size="13" fill="#c0392b">+</text>
  <circle cx="200" cy="460" r="4" fill="#1a1a1a"/>
  <text x="176" y="465" font-size="13" fill="#1a1a1a">-</text>

  <!-- Battery + -> L298N 12V/VMS -->
  <line x1="200" y1="425" x2="300" y2="425" stroke="#c0392b" stroke-width="3"/>

  <!-- Battery - -> common ground bus -->
  <line x1="200" y1="460" x2="230" y2="460" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="230" y1="460" x2="230" y2="600" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="230" y1="600" x2="300" y2="600" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="300" y1="600" x2="300" y2="530" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Motor -->
  <circle cx="820" cy="450" r="60" fill="#eafaf1" stroke="#2c3e50" stroke-width="2"/>
  <text x="820" y="458" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">M</text>
  <text x="820" y="530" text-anchor="middle" font-size="13" fill="#555555">DC Motor</text>

  <circle cx="760" cy="430" r="4" fill="#b9770e"/>
  <circle cx="760" cy="490" r="4" fill="#b9770e"/>

  <!-- L298N OUT -> Motor -->
  <line x1="660" y1="430" x2="760" y2="430" stroke="#b9770e" stroke-width="3"/>
  <line x1="660" y1="490" x2="760" y2="490" stroke="#b9770e" stroke-width="3"/>

  <!-- Common ground note -->
  <text x="480" y="640" text-anchor="middle" font-size="13" fill="#555555">All GND points (Nucleo, L298N, battery) share one common reference - do not power the Nucleo from the battery rail.</text>

  <!-- Direction truth table -->
  <g transform="translate(300,670)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#1a1a1a">Direction truth table:</text>
    <text x="0" y="22" font-size="12" fill="#1a1a1a">IN1=HIGH, IN2=LOW  -&gt; Forward</text>
    <text x="0" y="40" font-size="12" fill="#1a1a1a">IN1=LOW,  IN2=HIGH -&gt; Reverse</text>
    <text x="0" y="58" font-size="12" fill="#1a1a1a">IN1=LOW,  IN2=LOW  -&gt; Stop</text>
  </g>
</svg>
